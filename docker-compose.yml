services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: jade
      POSTGRES_PASSWORD: jade
      POSTGRES_DB: salao_jade
    # 5434: a 5432 é do Postgres local e a 5433 do container do VryGraphic
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
